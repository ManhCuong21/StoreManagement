name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

    - name: Find APK/AAB file
      id: find_file
      run: |
        echo "Finding APK or AAB file..."
        if [[ -f "app/build/outputs/apk/debug/app-debug.apk" ]]; then
          echo "::set-output name=path::app/build/outputs/apk/debug/app-debug.apk"
        elif [[ -f "app/build/outputs/bundle/debug/app-debug.aab" ]]; then
          echo "::set-output name=path::app/build/outputs/bundle/debug/app-debug.aab"
        else
          echo "No APK or AAB file found."
          exit 1
        fi
    - name: Upload to Firebase App Distribution
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STORE_MANAGEMENT_9A7D4 }}
      run: |
        npm install -g firebase-tools
        firebase appdistribution:distribute ${{ steps.find_file.outputs.path }} --app 1:314226506850:android:968b9c4aef457c6f32e53b --release-notes "Release notes for this version" --groups tester