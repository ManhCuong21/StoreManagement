name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

    - name: Get APK path
      run: echo "ANDROID_APK_PATH=$(pwd)/app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT

    - name: Upload to Firebase App Distribution
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STORE_MANAGEMENT_9A7D4 }}
      run: |
        npm install -g firebase-tools
        firebase appdistribution:distribute --app 1:314226506850:android:968b9c4aef457c6f32e53b --apk $ANDROID_APK_PATH