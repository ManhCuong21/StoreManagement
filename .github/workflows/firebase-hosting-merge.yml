name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Login Firebase
        run: firebase login

      - name: Auth Github
        uses: firebase-actions/auth@v1
        with:
          token: ${{ secrets.FIREBASE_TOKEN }}

      - uses: actions/checkout@v4
      - run: firebase deploy
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STORE_MANAGEMENT_9A7D4 }}
          channelId: live
          projectId: store-management-9a7d4
